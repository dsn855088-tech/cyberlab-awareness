<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigator sign in</title><link rel="stylesheet" href="/styles.css"><style>.card{max-width:440px;margin:12vh auto}</style></head><body class="bg"><main class="card"><small>CYBERLAB · PRIVATE AREA</small><h1>Investigator dashboard</h1><p>Sign in with the administrator password configured in Render.</p><form id="adminLogin"><label for="password">Administrator password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary">Sign in</button><p id="message" role="status"></p></form></main><script>document.getElementById('adminLogin').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Signing in…';try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){m.textContent=d.error||'Sign-in failed';return}location.reload()}catch(_){m.textContent='Could not connect. Try again.'}});</script></body></html>
