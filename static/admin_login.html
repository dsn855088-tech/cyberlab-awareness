<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigator Sign-in — CyberLab</title><link rel="stylesheet" href="/styles.css"><style>
.admin-shell{max-width:480px;margin:10vh auto;padding:24px}.admin-card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:28px;box-shadow:0 16px 50px #172b4d12;color:#182230}.admin-card h1{margin:0 0 8px}.admin-card p{color:#667085;line-height:1.5}.admin-card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dd;border-radius:8px;margin:8px 0 14px}.admin-card button{width:100%;padding:12px;border:0;border-radius:8px;background:#3056d3;color:white;font-weight:700;cursor:pointer}.admin-note{font-size:13px}.error{color:#b42318}
</style></head><body class="lesson-bg"><main class="admin-shell"><section class="admin-card"><div class="eyebrow">CYBERLAB · PRIVATE AREA</div><h1>Investigator dashboard</h1><p>Sign in with the administrator password configured by the project owner in Render. Participants do not need this password.</p><form id="adminLogin"><label for="adminPassword">Administrator password</label><input id="adminPassword" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">Sign in</button><p id="loginStatus" class="admin-note" role="status"></p></form><p class="admin-note">This dashboard shows anonymous training events only. It does not display or collect participant credentials.</p></section></main><script>
document.getElementById('adminLogin').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('loginStatus');status.textContent='Signing in…';try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPassword').value})});const d=await r.json();if(!r.ok){status.textContent=d.error||'Sign-in failed';status.className='admin-note error';return;}location.reload();}catch(_){status.textContent='Could not connect. Try again.';}});
</script></body></html>
